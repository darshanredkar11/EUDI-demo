# Exactly two services: the Rust deterministic engine and the Java thin API.
# No Kubernetes, no Kafka, no Redis, no databases.
services:
  engine:
    build: ./rust-engine
    restart: unless-stopped
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./java-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ENGINE_URL: http://engine:8081
      # Optional: set ANTHROPIC_API_KEY to enable the real LLM proposer.
      # Unset -> StubLlmResolver (identical guardrail pipeline).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      engine:
        condition: service_healthy
