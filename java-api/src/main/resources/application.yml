server:
  # Most one-click hosting platforms (Render, Railway, Fly, Heroku-style)
  # inject a dynamic PORT and require the app to bind to it. Same pattern
  # the Rust engine already uses (std::env::var("PORT")) — default 8080 for
  # local/Docker Compose where the port is fixed.
  port: ${PORT:8080}

spring:
  jackson:
    default-property-inclusion: non_null
  web:
    resources:
      # This is a live-iterated demo UI (index.html/app.js/styles.css) served
      # straight from the jar. Without this, browsers can heuristically cache
      # static assets across a rebuild/restart and silently keep showing a
      # stale UI — force revalidation on every load instead.
      cache:
        cachecontrol:
          no-cache: true

engine:
  base-url: ${ENGINE_URL:http://localhost:8081}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: claude-sonnet-4-6
  base-url: https://api.anthropic.com
  timeout-ms: 3000

logging:
  level:
    com.demo.eudi: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
